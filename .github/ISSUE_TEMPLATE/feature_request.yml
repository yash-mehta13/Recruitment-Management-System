name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem or need, description: What are you trying to do? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: dropdown
    id: backend
    attributes:
      label: Needs a backend or authentication?
      description: This project is frontend-only today; see docs/limitations-and-roadmap.md.
      options: ["No", "Yes", "Not sure"]
  - type: textarea
    id: extra
    attributes: { label: Additional context }
