name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: What happened?, description: Short description of the problem }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. Open the app\n2. Select Company B\n3. ..." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Observed behavior }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and version, placeholder: Chrome 130 }
  - type: input
    id: os
    attributes: { label: Operating system and device }
  - type: input
    id: node
    attributes: { label: Node.js version (if building locally), placeholder: v22.12.0 }
  - type: textarea
    id: extra
    attributes: { label: Console output, screenshots or other context, description: "Use synthetic data only. Do not paste real candidate information or credentials." }
